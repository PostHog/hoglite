name: CI

# Builds and tests every commit on main and every pull request.
# The ECR release workflow reads the result of the go-checks job for
# a main commit before it publishes that commit.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -Eeuo pipefail {0}

jobs:
  go-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test with the race detector
        run: go test -race ./...

      - name: Check gofmt
        run: |
          out=$(gofmt -l .)
          if [[ -n $out ]]; then
            echo "::error::these files need gofmt:"
            echo "$out"
            exit 1
          fi

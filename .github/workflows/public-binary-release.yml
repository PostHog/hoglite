name: Public binary release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: public-binary-release-${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

env:
  RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha }}

defaults:
  run:
    shell: bash --noprofile --norc -Eeuo pipefail {0}

jobs:
  test:
    if: >-
      github.repository == 'PostHog/hoglite' &&
      (
        github.event_name == 'pull_request' ||
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository
        )
      )
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            goos: linux
            goarch: amd64
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      CGO_ENABLED: '0'
      GOFLAGS: -mod=readonly
      EXPECTED_GOOS: ${{ matrix.goos }}
      EXPECTED_GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Verify the native target
        run: |
          test "$(go env GOOS)" = "$EXPECTED_GOOS"
          test "$(go env GOARCH)" = "$EXPECTED_GOARCH"
          test "$(go env GOHOSTOS)" = "$EXPECTED_GOOS"
          test "$(go env GOHOSTARCH)" = "$EXPECTED_GOARCH"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
      - name: Run native tests
        run: go test -timeout 20m ./...
      - name: Smoke test the native executable
        run: |
          binary="$RUNNER_TEMP/hoglited"
          go build -trimpath -ldflags "-X main.version=build-$RELEASE_SHA -X main.commit=$RELEASE_SHA" -o "$binary" ./cmd/hoglited
          test "$("$binary" -version)" = "hoglited build-$RELEASE_SHA (commit $RELEASE_SHA)"
          "$binary" -help > "$RUNNER_TEMP/hoglited-help.txt" 2>&1
          grep -F -- '-version' "$RUNNER_TEMP/hoglited-help.txt"

  snapshot:
    needs: test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Validate release packaging without publishing
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.20.0
          args: release --snapshot --clean

  publish:
    needs: test
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Prepare the tested main revision
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test -z "$(git status --porcelain)"
          tip=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          [[ "$tip" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$tip" != "$RELEASE_SHA" ]]; then
            echo 'Skip the superseded revision.'
            exit 0
          fi
          tag="build-$RELEASE_SHA"
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            test "$(git rev-parse "$tag^{commit}")" = "$RELEASE_SHA"
          else
            git tag "$tag" "$RELEASE_SHA"
          fi
          echo 'publish=true' >> "$GITHUB_OUTPUT"
      - name: Publish binaries with GoReleaser
        if: steps.release.outputs.publish == 'true'
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.20.0
          # The preceding step validates source and tag identity for non-SemVer tags.
          args: release --clean --skip=validate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GORELEASER_CURRENT_TAG: build-${{ env.RELEASE_SHA }}
